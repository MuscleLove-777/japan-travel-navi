baseURL = "https://musclelove-777.github.io/japan-travel-navi/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
theme = "PaperMod"
paginate = 20

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Japan Travel Navi"
    contentDir = "content/en"
    [languages.en.params]
      description = "Discover the best of Japan - temples, food, culture, and hidden gems"
      author = "Japan Travel Navi"
      [languages.en.params.homeInfoParams]
        Title = "Japan Travel Navi"
        Content = "Your ultimate guide to exploring Japan. Temples, shrines, food, culture, and off-the-beaten-path destinations."

  [languages.ja]
    languageName = "日本語"
    weight = 2
    title = "ジャパントラベルナビ"
    contentDir = "content/ja"
    [languages.ja.params]
      description = "日本の名所・グルメ・文化を紹介する観光ガイド"
      author = "ジャパントラベルナビ"
      [languages.ja.params.homeInfoParams]
        Title = "ジャパントラベルナビ"
        Content = "日本の寺社仏閣、グルメ、文化、穴場スポットを紹介します"

  [languages.zh]
    languageName = "中文"
    weight = 3
    title = "日本旅游导航"
    contentDir = "content/zh"
    [languages.zh.params]
      description = "探索日本最佳景点 - 寺庙、美食、文化和隐藏宝地"
      author = "日本旅游导航"
      [languages.zh.params.homeInfoParams]
        Title = "日本旅游导航"
        Content = "您的日本旅行终极指南。寺庙、神社、美食、文化和小众目的地。"

  [languages.ko]
    languageName = "한국어"
    weight = 4
    title = "일본여행나비"
    contentDir = "content/ko"
    [languages.ko.params]
      description = "일본 최고의 관광지를 발견하세요 - 사찰, 음식, 문화, 숨겨진 보석"
      author = "일본여행나비"
      [languages.ko.params.homeInfoParams]
        Title = "일본여행나비"
        Content = "일본 여행의 모든 것. 사찰, 신사, 음식, 문화, 숨은 명소를 소개합니다."

  [languages.es]
    languageName = "Español"
    weight = 5
    title = "Japón Travel Navi"
    contentDir = "content/es"
    [languages.es.params]
      description = "Descubre lo mejor de Japón - templos, gastronomía, cultura y joyas ocultas"
      author = "Japón Travel Navi"
      [languages.es.params.homeInfoParams]
        Title = "Japón Travel Navi"
        Content = "Tu guía definitiva para explorar Japón. Templos, santuarios, gastronomía, cultura y destinos fuera de lo común."

[params]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  comments = false
  keywords = ["Japan travel", "Japanese temples", "Japanese food", "Tokyo", "Kyoto", "Osaka", "Japan tourism", "Japan guide"]
  images = ["/images/japan-hero.jpg"]
  canonicalURL = true

[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

[sitemap]
  changefreq = "weekly"
  priority = 0.7

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

